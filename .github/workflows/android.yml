name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: python3 tools/verify_assets.py
      - run: python3 tools/sources.py check
      - run: python3 tools/write_addon_notices.py --check
      - run: python3 tools/write_privacy_page.py --check
      - run: python3 tools/audit_japanese_output.py
      - run: python3 tools/compile_paired_forms.py --check
      - run: python3 -m unittest discover -s tools -p test_sources.py
      - run: python3 -m unittest discover -s tools -p test_poj_readings.py
      - run: ./gradlew :core:regression :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease :app:lintDebug :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: minime-debug
          path: app/build/outputs/apk/debug/*.apk
